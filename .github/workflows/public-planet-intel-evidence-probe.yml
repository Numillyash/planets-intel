name: Public archive planet evidence probe (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  evidence:
    if: github.head_ref == 'fix/planet-intel-visibility-scout-rings'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Inspect public planet fields without observer data
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import asyncio
          from collections import Counter
          from app.services.public_archive_turn import fetch_finished_public_turn
          async def main():
              rst=await fetch_finished_public_turn(683230,4,54)
              out={}
              for p in rst["planets"]:
                  k="own" if p["owner_id"]==4 else "foreign" if p["owner_id"] is not None else "owner_unknown"
                  out.setdefault(k,[]).append(p)
              for k,ps in out.items():
                  print("GROUP",k,"count",len(ps))
                  print("INFO_TURN",dict(Counter(str(p["info_turn"]) for p in ps)))
                  print("FIELD_KEYS",dict(Counter(
                      key for p in ps for key,val in p["payload"].items()
                      if val is not None and key.lower() in {
                        "ownerid","infoturn","temp","temperature","clans","mines","factories",
                        "defense","supplies","megacredits","nativeclans","nativerace",
                        "neutronium","groundneutronium","densityneutronium","nativetaxrate","name"
                      }
                  )))
                  print("SAMPLE",[
                    {"id":p["planet_id"],"turn":p["info_turn"],
                     "keys":{key:val for key,val in p["payload"].items()
                           if key.lower() in {"ownerid","infoturn","temp","clans","mines","nativeclans","nativerace","groundneutronium","densityneutronium"}}
                    } for p in ps[:5]
                  ])
          asyncio.run(main())
          PY
