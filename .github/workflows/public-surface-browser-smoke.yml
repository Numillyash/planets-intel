name: Public surface browser smoke

on:
  pull_request:
    branches: [main]

jobs:
  public-map-browser:
    if: github.head_ref == 'fix/public-map-surface-navigation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend and temporary browser runner
        working-directory: frontend
        run: |
          npm install
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression against mocked public read-only API
        working-directory: frontend
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite-public-smoke.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/public-surface-smoke.mjs
      - name: Upload map and failure captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-screenshots
          path: /tmp/public-surface-smoke
          if-no-files-found: ignore
