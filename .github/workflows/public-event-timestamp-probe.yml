name: Public event timestamp probe (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  inspect-source:
    if: github.head_ref == 'fix/public-event-timestamps-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - name: Inspect public event field names and date values
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import asyncio
          from app.planetsnu.client import PlanetsNuClient
          async def main():
              p=await PlanetsNuClient().load_info(683230)
              print("GAME", {k:v for k,v in p["game"].items() if "date" in k.lower() or "time" in k.lower() or k in {"id","turn","status"}})
              events=p.get("events")
              print("EVENTS",type(events).__name__, len(events) if isinstance(events,list) else "N/A")
              if not isinstance(events,list):return
              for x in ([events[0],events[-1]]+sorted(events,key=lambda e:e.get("turn",0),reverse=True)[:4]):
                  if not isinstance(x,dict):continue
                  print("EVENT_SCHEMA",sorted(x.keys()),"TYPE",x.get("eventtype"),"TURN",x.get("turn"))
                  print("TIME_CANDIDATES",{k:v for k,v in x.items() if any(t in k.lower() for t in ("date","time","create","modified","stamp","host","posted","sent"))})
          asyncio.run(main())
          PY
