name: Public final turn read smoke (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  last-turn:
    if: github.head_ref == 'fix/public-archive-latest-dashboard-time-machine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - name: Check source final turn against archived player view
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from app.planetsnu.client import PlanetsNuClient
          from app.services.public_archive_turn import fetch_finished_public_turn

          async def check():
              client = PlanetsNuClient()
              for game_id in (683230, 184630):
                  try:
                      info = await client.load_info(game_id)
                      game = info["game"]
                      print("game",game_id,"public:",game.get("isprivate") is False,
                            "finished:",game.get("status")==3,"final:",game.get("turn"))
                      if game.get("isprivate") is not False or game.get("status")!=3:
                          continue
                      player_ids = [p["id"] for p in info["players"] if isinstance(p,dict)
                                    and isinstance(p.get("id"),int)
                                    and 1<=p["id"]<=35 and p.get("raceid",0)<100]
                      slot = 9 if game_id == 683230 and 9 in player_ids else player_ids[0]
                      last = game["turn"]
                      for turn in [last,max(1,last-1),max(1,last-2)]:
                          try:
                              result=await fetch_finished_public_turn(game_id,slot,turn)
                              print("PASS",game_id,"slot",slot,"turn",result["turn"],"counts",result["counts"])
                              break
                          except Exception as e:
                              print("RST candidate unavailable",game_id,"slot",slot,"turn",turn,
                                    "class",type(e).__name__)
                  except Exception as e:
                      print("game probe error",game_id,type(e).__name__)
          asyncio.run(check())
          PY
